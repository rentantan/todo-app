services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: todoapp_db
      POSTGRES_USER: todoapp_user
      POSTGRES_PASSWORD: todoapp_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todoapp_user -d todoapp_db"]
      interval: 5s
      retries: 10

  web:
    build: .
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - DATABASE_URL=postgresql://todoapp_user:todoapp_password@db:5432/todoapp_db
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
